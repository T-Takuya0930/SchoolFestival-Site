<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来のクリエイター診断 | 適性専攻チェック</title>
    <style>
        :root {
            --primary-color: #6200ea;
            --accent-color: #00e5ff;
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        .quiz-container { background: var(--card-color); width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        
        /* 進捗バー */
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; width: 20%; background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); transition: width 0.3s ease; }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        
        h1 { font-size: 24px; text-align: center; margin-bottom: 15px; color: var(--primary-color); }
        .intro-text { text-align: center; font-size: 14px; color: #666; margin-bottom: 30px; line-height: 1.6; }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }
        
        /* ボタンデザイン */
        .btn { display: block; width: 100%; padding: 16px; background: var(--card-color); border: 2px solid #e0e0e0; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: left; cursor: pointer; margin-bottom: 12px; transition: all 0.2s ease; }
        .btn:hover { border-color: var(--primary-color); background: #f9f6ff; }
        .btn-start { background: var(--primary-color); color: white; text-align: center; border: none; font-size: 18px; margin-top: 20px; }
        .btn-start:hover { background: #4a00b8; opacity: 0.9; }
        
        /* 結果画面 */
        .result-title { font-size: 16px; font-weight: bold; color: #666; text-align: center; margin-bottom: 5px; }
        .result-type { font-size: 26px; font-weight: bold; color: var(--primary-color); text-align: center; margin-bottom: 20px; }
        .recommend-box { background: #f9f6ff; border-left: 5px solid var(--primary-color); padding: 15px; border-radius: 0 10px 10px 0; margin-bottom: 20px; }
        .recommend-title { font-size: 14px; font-weight: bold; color: var(--primary-color); margin-bottom: 5px; }
        .recommend-list { list-style: none; padding-left: 0; display: grid; gap: 12px; }
        .recommend-list li { list-style: none; }
        .course-card {
            background: #ffffff;
            border: 1px solid #e8e1f7;
            border-radius: 14px;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            box-shadow: 0 8px 18px rgba(98, 0, 234, 0.06);
        }
        .course-name { font-size: 16px; font-weight: bold; color: var(--text-color); margin-bottom: 6px; line-height: 1.4; }
        .course-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
        .course-link { font-size: 13px; color: var(--primary-color); word-break: break-all; text-decoration: none; }
        .course-link:hover { text-decoration: underline; }
        .course-qr { width: 96px; height: 96px; border-radius: 10px; background: #fff; border: 1px solid #ece7f7; }
        .course-visual { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .course-qr-label { font-size: 11px; color: #777; }

        @media (max-width: 480px) {
            .course-card { grid-template-columns: 1fr; }
            .course-visual { align-items: flex-start; }
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="screen-start" class="screen active">
        <h1>✨ 未来のクリエイター診断 ✨</h1>
        <p class="intro-text">5つの質問に答えるだけ！<br>画像にある6つの分野・たくさんの専攻から、あなたに一番ぴったりの学び場を見つけよう！</p>
        <button class="btn btn-start" onclick="startQuiz()">診断をスタートする</button>
    </div>

    <div id="quiz-ready" style="display: none;">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        
        <div id="q-container">
            <p class="question-text" id="question-text">質問がここに表示されます</p>
            <div id="choices-box"></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <p class="result-title">あなたにおすすめの分野は…</p>
        <div class="result-type" id="result-category">○○分野</div>
        
        <div class="recommend-box">
            <div class="recommend-title" id="result-duration">○年制のあなたにおすすめの専攻</div>
            <ul class="recommend-list" id="result-majors">
                </ul>
        </div>
        <button class="btn btn-start" onclick="resetQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 質問データ
    const questions = [
        {
            q: "Q1. 普段の生活で、一番「テンションが上がる」瞬間は？",
            c: [
                { text: "友達とゲームで対戦したり、配信を見たりしているとき", type: "game" },
                { text: "パソコンやスマホの仕組み、最新のAI技術に触れたとき", type: "tech" },
                { text: "アニメやイラスト、動画を見たり描いたりしているとき", type: "creative" },
                { text: "機械をいじったり、何かモノを組み立てたりしているとき", type: "tech" } // ロボット要素もtechへ
            ]
        },
        {
            q: "Q2. 自分で何かを作るなら、どれに一番興味がある？",
            c: [
                { text: "ゲームのルールや、キャラクターを動かすプログラム", type: "game" },
                { text: "誰もが驚くような便利なアプリや、ハッカーを防ぐセキュリティ", type: "tech" },
                { text: "映画のような美しい3Dグラフィックや動画エフェクト", type: "creative" },
                { text: "魅力的なキャラクターイラスト、または最先端のVTuberモデル", type: "creative" }
            ]
        },
        {
            q: "Q3. あなたの「得意なこと」や「性格」に近いものは？",
            c: [
                { text: "負けず嫌い！ゲームの戦術を考えたり人を盛り上げるのが好き", type: "game" },
                { text: "ロジカルに考えるのが得意、または細かいバグを見つけるのが得意", type: "tech" },
                { text: "自分の世界観を表現したい！絵を描くことやデザインに没頭できる", type: "creative" },
                { text: "手先が器用、またはロボットやAIが勝手に動く仕組みにワクワクする", type: "tech" }
            ]
        },
        {
            q: "Q4. 将来、どんな場所で活躍してみたい？",
            c: [
                { text: "プロゲーマーの大会ステージや、esportsイベントの運営現場", type: "game" },
                { text: "大手IT企業や、最先端のAI開発チーム、セキュリティの最前線", type: "tech" },
                { text: "ゲーム会社、アニメ制作スタジオ、または映像制作クリエイターとして", type: "creative" },
                { text: "ロボットメーカーや、AIと機械を組み合わせた開発現場", type: "tech" }
            ]
        },
        {
            q: "Q5. 専門学校で学ぶなら、期間はどっちがいい？",
            c: [
                { text: "【4年制】じっくり学んで「高度専門士」を目指しトッププロへ！", type: "4year" },
                { text: "【3年制】集中して「専門士」を取得し、早く即戦力デビュー！", type: "3year" }
            ]
        }
    ];

    // 専攻データマッピング
    const majorData = {
        game: {
            name: "ゲーム・esports分野",
            courses: [
                { name: "スーパーゲームクリエイター専攻", years: "4年制", url: "https://www.tech.ac.jp/course/supergamecreator/" },
                { name: "esportsプロマネージメント専攻", years: "4年制", url: "https://www.tech.ac.jp/course/esportspromanager/" },
                { name: "esportsストリーマー＆ゲーム実況専攻", years: "4年制", url: "https://www.tech.ac.jp/course/esportsstreamer/" },
                { name: "esportsプロゲーマー専攻", years: "3年制", url: "https://www.tech.ac.jp/course/esportsprogamer/" },
                { name: "ゲームプログラマー専攻", years: "3年制", url: "https://www.tech.ac.jp/course/gameprogrammer/" },
                { name: "ゲームCGデザイン専攻", years: "3年制", url: "https://www.tech.ac.jp/course/gamecgdesign/" },
                { name: "ゲームキャラクターデザイン専攻", years: "3年制", url: "https://www.tech.ac.jp/course/gamecharacterdesign/" }
            ]
        },
        tech: {
            name: "IT・AI・ロボット分野",
            courses: [
                { name: "スーパーITエンジニア専攻", years: "4年制", url: "https://www.tech.ac.jp/course/superitengineer/" },
                { name: "スーパーAIクリエイター専攻", years: "4年制", url: "https://www.tech.ac.jp/course/superaicreator/" },
                { name: "スーパーホワイトハッカー専攻", years: "4年制", url: "https://www.tech.ac.jp/course/superwhitehacker/" },
                { name: "ロボット・AIエンジニア専攻", years: "4年制", url: "https://www.tech.ac.jp/course/robotaiengineer/" },
                { name: "UI・UXデザイナー専攻", years: "3年制", url: "https://www.tech.ac.jp/course/uiuxdesigner/" },
                { name: "ITプログラマー専攻", years: "3年制", url: "https://www.tech.ac.jp/course/itprogrammer/" }
            ]
        },
        creative: {
            name: "CG・映像・イラスト・アニメ分野",
            courses: [
                { name: "スーパーCGクリエイター専攻", years: "4年制", url: "https://www.tech.ac.jp/course/supercgcreator/" },
                { name: "スーパーデジタルメディア専攻", years: "4年制", url: "https://www.tech.ac.jp/course/superdigitalmedia/" },
                { name: "スーパーコミックイラスト専攻", years: "4年制", url: "https://www.tech.ac.jp/course/supercomicillustration/" },
                { name: "スーパーVTuber専攻", years: "4年制", url: "https://www.tech.ac.jp/course/supervtuber/" },
                { name: "CGクリエイター専攻", years: "3年制", url: "https://www.tech.ac.jp/course/cgcreator/" },
                { name: "ネット動画クリエイター専攻", years: "3年制", url: "https://www.tech.ac.jp/course/netmoviecreator/" },
                { name: "コミックイラスト専攻", years: "3年制", url: "https://www.tech.ac.jp/course/comicillustration/" },
                { name: "アニメーション専攻", years: "3年制", url: "https://www.tech.ac.jp/course/animation/" }
            ]
        }
    };

    let currentQ = 0;
    let scores = { game: 0, tech: 0, creative: 0 };
    let duration = "4year"; // デフォルト

    function startQuiz() {
        document.getElementById('screen-start').style.display = 'none';
        document.getElementById('quiz-ready').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        // プロ進捗バー更新
        const progressPercent = ((currentQ + 1) / questions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';

        const qData = questions[currentQ];
        document.getElementById('question-text').innerText = qData.q;
        
        const choicesBox = document.getElementById('choices-box');
        choicesBox.innerHTML = '';

        qData.c.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'btn';
            button.innerText = choice.text;
            button.onclick = () => selectAnswer(choice.type);
            choicesBox.appendChild(button);
        });
    }

    function selectAnswer(type) {
        if (type === "4year" || type === "3year") {
            duration = type;
        } else {
            scores[type]++;
        }

        currentQ++;

        if (currentQ < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-ready').style.display = 'none';
        document.getElementById('screen-result').classList.add('active');

        // 一番得点が高いカテゴリを判定
        let maxType = 'game';
        if (scores.tech > scores.game && scores.tech >= scores.creative) maxType = 'tech';
        if (scores.creative > scores.game && scores.creative > scores.tech) maxType = 'creative';

        const resultObj = majorData[maxType];
        const selectedDurationText = duration === "4year" ? "4年制（高度専門士）" : "3年制（専門士）";
        const durationLabel = duration === "4year" ? "4年制" : "3年制";

        // 画面書き換え
        document.getElementById('result-category').innerText = resultObj.name;
        document.getElementById('result-duration').innerText = `📌 ${selectedDurationText}でおすすめの専攻`;

        const majorsList = document.getElementById('result-majors');
        majorsList.innerHTML = '';
        
        resultObj.courses.filter(course => course.years === durationLabel).forEach(course => {
            const li = document.createElement('li');
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(course.url)}`;
            li.innerHTML = `
                <div class="course-card">
                    <div>
                        <div class="course-name">${course.name}</div>
                        <div class="course-meta">${course.years}</div>
                        <a class="course-link" href="${course.url}" target="_blank" rel="noopener noreferrer">${course.url}</a>
                    </div>
                    <div class="course-visual">
                        <img class="course-qr" src="${qrUrl}" alt="${course.name} のQRコード">
                        <div class="course-qr-label">QRコード</div>
                    </div>
                </div>`;
            majorsList.appendChild(li);
        });
    }

    function resetQuiz() {
        currentQ = 0;
        scores = { game: 0, tech: 0, creative: 0 };
        duration = "4year";
        document.getElementById('screen-result').classList.remove('active');
        document.getElementById('screen-start').style.display = 'block';
    }
</script>
</body>
</html>
